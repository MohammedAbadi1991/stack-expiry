AWSTemplateFormatVersion: '2010-09-09'
Description: A throwaway stack for trying stack-expiry. A queue, a topic and a role.

Resources:
  Queue:
    Type: AWS::SQS::Queue
  Topic:
    Type: AWS::SNS::Topic
  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

Outputs:
  QueueUrl:
    Value: !Ref Queue
